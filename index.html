<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List Life Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Header: time, date, greeting, theme toggle -->
  <header class="card card--clock">
    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch to dark mode" title="Toggle light / dark mode">🌙</button>
    <time id="clock" class="clock">00:00:00</time>
    <time id="date" class="date"></time>
    <h1 id="greeting" class="greeting">Good Morning</h1>

    <!-- Details + Summary: collapsible "custom name" form -->
    <details id="name-details" class="name-details">
      <summary id="name-summary">✎ Set your name</summary>
      <form id="name-form" class="name-form">
        <input id="name-input" type="text" maxlength="30" placeholder="Your name" autocomplete="given-name" aria-label="Your name">
        <button type="submit" class="btn btn--primary">Save</button>
        <button type="button" id="name-cancel" class="btn btn--neutral">Cancel</button>
      </form>
    </details>
  </header>

  <main class="dashboard">

    <!-- Section: Focus Timer -->
    <section class="card card--timer" aria-labelledby="timer-title">
      <h2 id="timer-title">Focus Timer</h2>
      <div id="timer-display" class="timer-display">25:00</div>
      <p id="timer-status" class="timer-status" aria-live="polite"></p>
      <div class="btn-row">
        <button id="timer-start" class="btn btn--gold" type="button">Start</button>
        <button id="timer-stop" class="btn btn--neutral" type="button">Stop</button>
        <button id="timer-reset" class="btn btn--neutral" type="button">Reset</button>
      </div>
    </section>

    <!-- Section: To-Do List (each task is rendered as an <article> by app.js) -->
    <section class="card card--tasks" aria-labelledby="tasks-title">
      <h2 id="tasks-title">Tasks</h2>
      <form id="task-form" class="row-form" autocomplete="off">
        <input id="task-input" type="text" placeholder="Add a new task..." maxlength="120" aria-label="New task">
        <button type="submit" class="btn btn--primary">Add</button>
      </form>
      <p id="task-message" class="message" role="alert" hidden></p>
      <ul id="task-list" class="task-list"></ul>
      <p id="task-empty" class="empty">No tasks yet. Add your first one!</p>
    </section>

    <!-- Aside: supplementary shortcuts, with a nav of links inside -->
    <aside class="card card--links" aria-labelledby="links-title">
      <h2 id="links-title">Quick Links</h2>
      <form id="link-form" class="link-form" autocomplete="off">
        <input id="link-name" type="text" placeholder="Link name" maxlength="20" aria-label="Link name">
        <input id="link-url" type="text" placeholder="URL" aria-label="Link URL">
        <button type="submit" class="btn btn--primary">Add Link</button>
      </form>
      <p id="link-message" class="message" role="alert" hidden></p>
      <nav id="link-list" class="link-list" aria-label="Quick links"></nav>
    </aside>

  </main>

  <footer class="site-footer">
    <p>To-Do List Life Dashboard · Your data is saved only in this browser</p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
